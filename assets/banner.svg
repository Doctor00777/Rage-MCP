<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="1200" height="320" role="img" aria-label="Rage MCP — Authorized Web-Security Recon Scanner">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b0e14"/>
      <stop offset="0.55" stop-color="#140a0c"/>
      <stop offset="1" stop-color="#2a0d0b"/>
    </linearGradient>
    <linearGradient id="red" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ef4444"/>
      <stop offset="1" stop-color="#b91c1c"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1200" height="320" fill="url(#bg)"/>
  <g stroke="#ffffff" stroke-opacity="0.04" stroke-width="1">
    <path d="M0 80 H1200 M0 160 H1200 M0 240 H1200"/>
    <path d="M150 0 V320 M300 0 V320 M450 0 V320 M600 0 V320 M750 0 V320 M900 0 V320 M1050 0 V320"/>
  </g>

  <g transform="translate(96,160)">
    <path d="M0,-72 L62,-46 L62,10 C62,54 34,80 0,96 C-34,80 -62,54 -62,10 L-62,-46 Z"
          fill="none" stroke="url(#red)" stroke-width="7" filter="url(#glow)"/>
    <path d="M-26,2 L-6,26 L30,-24" fill="none" stroke="url(#red)" stroke-width="9"
          stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <text x="208" y="150" font-family="Segoe UI, Arial, sans-serif" font-size="104" font-weight="800"
        fill="#ffffff" letter-spacing="2">rage<tspan fill="url(#red)">.</tspan></text>
  <text x="214" y="196" font-family="Consolas, monospace" font-size="27" fill="#e5e7eb">Authorized Web-Security Recon Scanner</text>

  <g font-family="Consolas, monospace" font-size="19">
    <text x="214" y="246" fill="#fca5a5">OWASP Top 10 (2026)</text>
    <text x="470" y="246" fill="#e5e7eb">CLI · Web UI · MCP-native</text>
  </g>
  <text x="214" y="286" font-family="Consolas, monospace" font-size="16" fill="#6b7280">detection, not exploitation  ·  authorized targets only  ·  stdlib core</text>
</svg>
